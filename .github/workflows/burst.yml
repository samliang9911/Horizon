name: Horizon Burst Alert

# Run every hour. Trigger only on items scoring ≥ 8; silent otherwise.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: burst-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-burst:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Horizon image
        run: |
          docker build -t horizon:burst .

      - name: Run Horizon burst (2h window, threshold 8)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Shanghai
        run: |
          # Container runs as uid 10001; the checkout dir belongs to the runner.
          sudo chown -R 10001:10001 data profiles
          mkdir -p data/summaries
          set +e
          docker run --rm \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/profiles:/app/profiles" \
            -e TZ=Asia/Shanghai \
            -e GROQ_API_KEY \
            horizon:burst \
            -c /app/data/config-burst.json \
            --hours 2 2>&1 | tee horizon-run.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Horizon burst (exit=$rc)"
            echo '```'
            tail -n 60 horizon-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Notify PushPlus + WeCom
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          chmod +x scripts/push.sh
          TODAY=$(TZ=Asia/Shanghai date +%F)
          ZH="data/summaries/horizon-${TODAY}-zh.md"
          EN="data/summaries/horizon-${TODAY}-en.md"
          [ -f "$ZH" ] || ZH=""
          [ -f "$EN" ] || EN=""
          ./scripts/push.sh burst "$ZH" "$EN" || true
