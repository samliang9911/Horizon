name: Horizon Burst Alert

# Run every hour. Trigger only on items scoring ≥ 8; silent otherwise.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

concurrency:
  group: burst-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-burst:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Horizon image
        run: |
          docker build -t horizon:burst .

      - name: Run Horizon burst (2h window, threshold 8)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Shanghai
        run: |
          docker run --rm \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/profiles:/app/profiles" \
            -e TZ=Asia/Shanghai \
            -e GROQ_API_KEY \
            horizon:burst \
            -c /app/data/config-burst.json \
            --hours 2

      - name: Notify PushPlus + WeCom
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          chmod +x scripts/push.sh
          ZH=$(ls -t data/summaries/horizon-*-zh.md 2>/dev/null | head -n1)
          EN=$(ls -t data/summaries/horizon-*-en.md 2>/dev/null | head -n1)
          ./scripts/push.sh burst "$ZH" "$EN" || true
