name: Horizon Daily Digest

# Twice per day (08:20 / 20:20 Beijing time). Always sends.
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Horizon image
        run: |
          docker build -t horizon:daily .

      - name: Check secrets
        run: |
          [ -n "${{ secrets.GROQ_API_KEY }}" ] && echo "GROQ_API_KEY=set" || echo "GROQ_API_KEY=MISSING"
          [ -n "${{ secrets.PUSHPLUS_TOKEN }}" ] && echo "PUSHPLUS_TOKEN=set" || echo "PUSHPLUS_TOKEN=MISSING"
          [ -n "${{ secrets.WECOM_WEBHOOK }}" ] && echo "WECOM_WEBHOOK=set" || echo "WECOM_WEBHOOK=MISSING"

      - name: Run Horizon daily (12h window, threshold 5.5)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Shanghai
        run: |
          # Container runs as uid 10001; the checkout dir belongs to the runner.
          sudo chown -R 10001:10001 data profiles
          mkdir -p data/summaries
          docker run --rm \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/profiles:/app/profiles" \
            -e TZ=Asia/Shanghai \
            -e GROQ_API_KEY \
            horizon:daily \
            -c /app/data/config.actions.json \
            --hours 12

      - name: Notify PushPlus + WeCom
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          chmod +x scripts/push.sh
          ZH=$(ls -t data/summaries/horizon-*-zh.md 2>/dev/null | head -n1)
          EN=$(ls -t data/summaries/horizon-*-en.md 2>/dev/null | head -n1)
          ./scripts/push.sh daily "$ZH" "$EN" || true
