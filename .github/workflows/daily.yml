name: Horizon Daily Digest

# Twice per day (08:20 / 20:20 Beijing time). Always sends.
on:
  schedule:
    - cron: "20 0 * * *"
    - cron: "20 12 * * *"
  workflow_dispatch:

concurrency:
  group: daily-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Horizon image
        run: |
          docker build -t horizon:daily .

      - name: Check secrets
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          {
            echo "### Secrets"
            echo "- GROQ_API_KEY: $( [ -n "$GROQ_API_KEY" ] && echo set || echo MISSING )"
            echo "- PUSHPLUS_TOKEN: $( [ -n "$PUSHPLUS_TOKEN" ] && echo set || echo MISSING )"
            echo "- WECOM_WEBHOOK: $( [ -n "$WECOM_WEBHOOK" ] && echo set || echo MISSING )"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Horizon daily (12h window, threshold 5.5)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TZ: Asia/Shanghai
        run: |
          # Container runs as uid 10001; the checkout dir belongs to the runner.
          sudo chown -R 10001:10001 data profiles
          mkdir -p data/summaries
          set +e
          docker run --rm \
            -v "$(pwd)/data:/app/data" \
            -v "$(pwd)/profiles:/app/profiles" \
            -e TZ=Asia/Shanghai \
            -e GROQ_API_KEY \
            horizon:daily \
            -c /app/data/config.actions.json \
            --hours 12 2>&1 | tee horizon-run.log
          rc=${PIPESTATUS[0]}
          {
            echo "### Horizon run (exit=$rc)"
            echo '```'
            tail -n 60 horizon-run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

      - name: Notify PushPlus + WeCom
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: |
          chmod +x scripts/push.sh
          TODAY=$(TZ=Asia/Shanghai date +%F)
          ZH="data/summaries/horizon-${TODAY}-zh.md"
          EN="data/summaries/horizon-${TODAY}-en.md"
          [ -f "$ZH" ] || ZH=""
          [ -f "$EN" ] || EN=""
          ./scripts/push.sh daily "$ZH" "$EN" || true
